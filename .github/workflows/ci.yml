name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test

  codex-e2e:
    runs-on: ubuntu-latest
    needs: test
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PULSE_API_URL: ${{ secrets.PULSE_API_URL }}
      PULSE_API_KEY: ${{ secrets.PULSE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Codex e2e secrets
        shell: bash
        run: |
          missing=0
          for name in OPENAI_API_KEY PULSE_API_URL PULSE_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} secret is required to run Codex e2e."
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

      - name: Run Codex basic e2e
        run: make e2e-codex

      - name: Run Codex tools e2e
        run: make e2e-codex-tools
